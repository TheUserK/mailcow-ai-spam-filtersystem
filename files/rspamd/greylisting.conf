# Greylisting: verdaechtige Absender einmal abweisen und auf den zweiten
# Zustellversuch warten.
#
# Wirkt gegen billige Massenversender, die keinen Retry implementieren -
# also gegen genau die Kaltakquise-Werkzeuge, die hier taeglich aufschlagen.
# Echte Mailserver liefern nach wenigen Minuten erneut aus.
#
# PREIS: Post von neuen Absendern kommt beim ERSTEN Kontakt verzoegert an,
# typisch 5 bis 15 Minuten. Bei bekannten Absendern nie wieder. Wer das
# nicht will, setzt "enabled = false" und startet rspamd neu.
#
# Die Schwelle liegt bewusst UNTER der Junk-Schwelle: Post, die ohnehin
# sauber durchgeht, wird nicht angefasst.

enabled = true;

# Ab welchem Score wird verzoegert. Junk beginnt bei 6, Ablehnung bei 15.
greylist_min_score = 4.0;

# Wie lange der erste Versuch abgewiesen wird.
timeout = 5min;

# Wie lange ein bestandener Absender in Erinnerung bleibt.
expire = 1d;

# Nichts verzoegern, was schon als vertrauenswuerdig gilt.
check_local = false;
check_authed = false;
