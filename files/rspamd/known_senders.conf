# Wer hat uns schon einmal geschrieben?
#
# Rspamd fuehrt in Redis Buch ueber gesehene Absender und setzt
# KNOWN_SENDER bzw. UNKNOWN_SENDER.
#
# Bewusst mit der Vorgabe "nur Freemail-Domains": Bei Firmendomains gibt
# es Reputation, DKIM und DMARC - bei Gmail oder Hotmail mit Millionen
# Konten sagt die Domain gar nichts. Genau dort sitzt hier der Spam, und
# genau dort hilft die Frage "haben wir von dem schon mal gehoert?".
#
# Bewusst mit Score 0: das Signal soll die KI informieren, nicht selbst
# Punkte vergeben. Gekaperte Konten echter Firmen sind hier der haeufigste
# Phishing-Weg, ein bekannter Absender ist also kein Freibrief.
enabled = true;
max_senders = 100000;
max_ttl = 30d;
symbol_known = "KNOWN_SENDER";
symbol_unknown = "UNKNOWN_SENDER";
