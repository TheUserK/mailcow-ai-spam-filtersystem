# Antworten auf unsere eigene Post erkennen.
#
# Rspamd merkt sich die Message-IDs ausgehender Mail und setzt REPLY,
# wenn eine eingehende Mail darauf antwortet. Das staerkste lokale
# Ham-Signal, das es gibt - und es kostet nichts.
#
# Die Vorgabe von einem Tag ist fuer Geschaeftskorrespondenz zu kurz:
# auf ein Angebot antwortet niemand innerhalb von 24 Stunden.
#
# Bewusst OHNE action-Ueberschreibung. Das Modul kann eine Antwort hart
# auf "no action" setzen und damit am Junk vorbeischleusen. Auch ein
# echter Thread kann aber Schadpost tragen, wenn das Gegenueber gekapert
# wurde - das Signal geht deshalb nur als Hinweis an die KI.
enabled = true;
expire = 30d;
symbol = "REPLY";
