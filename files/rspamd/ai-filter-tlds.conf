# Punktaufschlag fuer Absender auf Wegwerf-Topleveldomains.
#
# Bewusst KEIN Block und kein Reject: 2.5 Punkte reichen allein weder fuer
# den Junk-Ordner (6) noch fuer eine Ablehnung (15). Der Aufschlag wirkt nur
# zusammen mit dem, was Rspamd und die KI ohnehin schon sehen. Auf diesen
# Endungen gibt es echte Firmen - sie sollen Post schicken koennen, nur eben
# nicht mit demselben Vertrauensvorschuss wie eine .de-Adresse.
#
# Gilt fuer die Absenderdomain, nicht fuer verlinkte Domains: Ein Link auf
# eine .shop-Seite ist in einem Newsletter voellig normal.
#
# Liste anpassen: data/conf/rspamd/ai-filter-tlds.map
# Aufschlag aendern: die Zahl unter "score" in local.d/groups.conf

AI_FILTER_FISHY_TLD {
  type = "from";
  filter = "top";
  map = "$CONFDIR/ai-filter-tlds.map";
  symbol = "AI_FILTER_FISHY_TLD";
  description = "Absenderdomain auf einer haeufig missbrauchten TLD";
  score = 2.5;
}
