services:
  ai-checker:
    # Built locally instead of using a stock php image: the official images
    # do not include pdo_sqlite, which the domain-rank and relationship
    # lookups need.
    build:
      context: ./data/ai-checker
    container_name: mailcow-ai-checker
    restart: always
    volumes:
      - ./data/ai-checker:/app:ro
      - ./data/logs/ai-checker:/var/log/ai-checker:rw
    working_dir: /app
    # session.upload_progress is switched off: the checker uses no sessions
    # and takes no uploads, so the feature is only attack surface.
    command: php -d session.upload_progress.enabled=0 -S 0.0.0.0:8080 router.php
    networks:
      mailcow-network:
        aliases:
          - ai-checker
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo file_get_contents(\"http://localhost:8080/health\");' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # This container reads mail an attacker wrote and talks to the internet.
    # It gets nothing it does not need: no capabilities, no way to gain
    # privileges, a read-only root filesystem (only the log directory and
    # /tmp are writable) and a memory ceiling.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # No database credentials here any more: the list of local domains is
      # exported hourly by ai-filter-domains.sh to data/ai-checker/local_domains.json.
      #
      # php -S is single-worker by default, which serialises every mail behind
      # the slowest AI call. Without this a burst of mail runs into rspamd's
      # http_timeout. Eight since 12.11.: with four, a stalled provider
      # (up to 20 s per call) left no free worker during a spam wave.
      - PHP_CLI_SERVER_WORKERS=8
